services:
  - type: web
    name: mathcorner-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: PORT
        value: 10000
      - key: HOST
        value: 0.0.0.0
      - key: DATABASE_URL
        fromDatabase:
          name: mathcorner-postgres
          property: connectionString
      - key: DB_SSL
        value: true
      - key: CORS_ORIGIN
        value: https://akshadanagare.github.io
      - key: LOG_LEVEL
        value: info

databases:
  - name: mathcorner-postgres
    plan: free
    databaseName: calculation
    user: calculation_user
